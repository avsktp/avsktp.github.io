<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="800" height="400">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4c0519"/>
      <stop offset="50%" stop-color="#881337"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
  </defs>
  <rect width="800" height="400" fill="url(#bg)"/>
  <circle cx="700" cy="80" r="140" fill="#be123c" opacity="0.25"/>
  <circle cx="100" cy="350" r="180" fill="#fbbf24" opacity="0.1"/>
  
  <!-- Badge -->
  <rect x="350" y="50" width="100" height="100" rx="24" fill="url(#gold)"/>
  <rect x="354" y="54" width="92" height="92" rx="20" fill="#4c0519"/>
  <text x="400" y="105" font-family="system-ui, sans-serif" font-size="28" font-weight="900" fill="#fbbf24" text-anchor="middle">KṬP</text>
  <text x="400" y="130" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#fecdd3" text-anchor="middle">AVS</text>

  <!-- Titles -->
  <text x="400" y="195" font-family="system-ui, sans-serif" font-size="26" font-weight="800" fill="#ffffff" text-anchor="middle" letter-spacing="2">KRISTIAN ṬHALAI PAWL</text>
  <text x="400" y="225" font-family="system-ui, sans-serif" font-size="16" font-weight="600" fill="#fde68a" text-anchor="middle">ARMED VENG SOUTH BRANCH</text>
  <text x="400" y="250" font-family="system-ui, sans-serif" font-size="13" font-style="italic" fill="#cbd5e1" text-anchor="middle">"Rawngbawl tura chhandam" (Ephesi 2:10)</text>

  <!-- Group Pills -->
  <g transform="translate(140, 290)">
    <!-- Luka -->
    <rect x="0" y="0" width="120" height="40" rx="12" fill="#ecfdf5" stroke="#10b981" stroke-width="1.5"/>
    <circle cx="20" cy="20" r="5" fill="#10b981"/>
    <text x="65" y="25" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#065f46" text-anchor="middle">Luka Group</text>
    
    <!-- Matheua -->
    <rect x="135" y="0" width="120" height="40" rx="12" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5"/>
    <circle cx="155" cy="20" r="5" fill="#3b82f6"/>
    <text x="200" y="25" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#1e40af" text-anchor="middle">Matheua Group</text>

    <!-- Marka -->
    <rect x="270" y="0" width="120" height="40" rx="12" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/>
    <circle cx="290" cy="20" r="5" fill="#f59e0b"/>
    <text x="335" y="25" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#92400e" text-anchor="middle">Marka Group</text>

    <!-- Johana -->
    <rect x="405" y="0" width="120" height="40" rx="12" fill="#faf5ff" stroke="#a855f7" stroke-width="1.5"/>
    <circle cx="425" cy="20" r="5" fill="#a855f7"/>
    <text x="470" y="25" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#6b21a8" text-anchor="middle">Johana Group</text>
  </g>
</svg>

